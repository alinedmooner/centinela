[project]
name = "centinela-ia"
version = "0.2.0"
description = "Open-source guard for AI assistants that read messages in Spanish: it detects hidden instructions and deception tricks, and leaves the sensitive decisions to code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Centinela team" }]
keywords = ["security", "ai", "agents", "prompt-injection", "phishing", "spanish"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# The basic mode (rules) needs no dependency.
dependencies = []

[project.urls]
Homepage = "https://centinela.alinedlabs.co"
Repository = "https://github.com/alinedmooner/centinela"
Issues = "https://github.com/alinedmooner/centinela/issues"
Documentation = "https://github.com/alinedmooner/centinela#readme"

[project.scripts]
centinela = "centinela.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic>=2.6.0",
]
local = [
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]
evals = [
    "anthropic>=2.6.0",
    "google-genai>=3.0.0",
    "inspect-ai>=0.3.288",
    "openai>=3.46.0",
    "scikit-learn>=1.9.1",
]
google = [
    "google-genai>=3.0.0",
]
openrouter = [
    "openai>=3.46.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]
# For the Composio demo (examples/composio_mailbox.py); it is not part of the package.
composio = ["composio>=0.31.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centinela"]

# The source package carries only the code and the legal texts; the data, the results and the
# website stay in the repository.
[tool.hatch.build.targets.sdist]
include = ["/src/centinela", "/README.md", "/LICENSE", "/ATTRIBUTIONS.md"]

[tool.uv]
# Waiting period: nothing published in the last 7 days is installed.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals"]

[tool.ruff]
line-length = 100

# The `local` extra uses the CPU build of PyTorch: the detectors are small and need no GPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The PyTorch index does not publish upload dates, so it skips the waiting period.
[tool.uv.exclude-newer-package]
torch = false
