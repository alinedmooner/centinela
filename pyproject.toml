[project]
name = "centinela-ia"
version = "0.1.0"
description = "Guardia de código abierto para asistentes de IA que leen mensajes en español: detecta órdenes escondidas y trucos de engaño, y deja las decisiones delicadas en manos del código."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Equipo Centinela" }]
keywords = ["seguridad", "ia", "agentes", "prompt-injection", "phishing", "español"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# El modo básico (reglas) no necesita ninguna dependencia.
dependencies = []

[project.scripts]
centinela = "centinela.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic>=2.6.0",
]
local = [
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centinela"]

[tool.uv]
# Periodo de espera: no se instala nada publicado en los últimos 7 días.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# El extra «local» usa PyTorch para CPU: los detectores son pequeños y no necesitan GPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# El índice de PyTorch no publica fechas de subida, así que no pasa por el periodo de espera.
[tool.uv.exclude-newer-package]
torch = false
