[project]
name = "centinela-ia"
version = "0.1.1"
description = "Guardia de código abierto para asistentes de IA que leen mensajes en español: detecta órdenes escondidas y trucos de engaño, y deja las decisiones delicadas en manos del código."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Equipo Centinela" }]
keywords = ["seguridad", "ia", "agentes", "prompt-injection", "phishing", "español"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# El modo básico (reglas) no necesita ninguna dependencia.
dependencies = []

[project.urls]
Homepage = "https://centinela.alinedlabs.co"
Repository = "https://github.com/alinedmooner/centinela"
Issues = "https://github.com/alinedmooner/centinela/issues"
Documentation = "https://github.com/alinedmooner/centinela#readme"

[project.scripts]
centinela = "centinela.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic>=2.6.0",
]
local = [
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]
evals = [
    "anthropic>=2.6.0",
    "google-genai>=3.0.0",
    "inspect-ai>=0.3.288",
    "openai>=3.46.0",
    "scikit-learn>=1.9.1",
]
google = [
    "google-genai>=3.0.0",
]
openrouter = [
    "openai>=3.46.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]
# Para la demostración con Composio (ejemplos/composio_buzon.py); no es parte del paquete.
composio = ["composio>=0.31.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centinela"]

# El paquete fuente lleva solo el código y los textos legales; los datos, los resultados
# y el sitio web se quedan en el repositorio.
[tool.hatch.build.targets.sdist]
include = ["/src/centinela", "/README.md", "/LICENSE", "/ATRIBUCIONES.md"]

[tool.uv]
# Periodo de espera: no se instala nada publicado en los últimos 7 días.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals"]

[tool.ruff]
line-length = 100

# El extra «local» usa PyTorch para CPU: los detectores son pequeños y no necesitan GPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# El índice de PyTorch no publica fechas de subida, así que no pasa por el periodo de espera.
[tool.uv.exclude-newer-package]
torch = false
