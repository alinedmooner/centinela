# Spanish -> English names for scripts/rename_names.py (one-shot; see that script).
#
# The map also generates the equivalence table in docs/migrating-to-0.2.md. Only NAME tokens
# are renamed: identifiers, attributes, keyword arguments and module path segments. Strings,
# comments and everything a model sees stay as they are.

[ignore]
# English or third-party names the unmapped-identifier check cannot recognise.
names = [
  "capsys", "readouterr", "tmp_path", "monkeypatch", "parametrize", "importorskip", "argparse",
  "argv", "nargs", "kwargs", "attrs", "imap", "imaplib", "IMAP4", "IMAP4_SSL", "smtplib", "SMTP",
  "SMTP_SSL", "SMTPAuthenticationError", "starttls", "ssl", "ssl_context", "gmail", "Gmail",
  "composio", "anthropic", "openai", "genai", "sklearn", "StratifiedKFold", "TfidfVectorizer",
  "ngram_range", "sublinear_tf", "max_iter", "MarianMTModel", "MarianTokenizer", "from_pretrained",
  "num_beams", "preferencelist", "usage_metadata", "output_config", "list_eval_logs",
  "read_eval_log", "task_args", "GenerateConfig", "MemoryDataset", "Anthropic", "APIConnectionError",
  "APIStatusError", "HTMLParser", "convert_charrefs", "handle_starttag", "handle_endtag", "urlsplit",
  "urlsafe_b64encode", "urlsafe_b64decode", "formatdate", "make_msgid", "parseaddr",
  "get_filename", "get_content_maintype", "maintype", "subtype", "is_multipart", "iter_attachments",
  "SequenceMatcher", "autojunk", "difflib", "tomllib", "unicodedata", "textwrap", "importlib",
  "itertools", "contextlib", "hashlib", "hexdigest", "sha256", "shutil", "copytree", "runpy",
  "runtime_checkable", "defaultdict", "SimpleNamespace", "Namespace", "parse_args", "add_subparsers",
  "set_defaults", "redirect_stderr", "redirect_stdout", "getvalue", "splitlines", "startswith",
  "endswith", "rsplit", "rstrip", "fromkeys", "setdefault", "findall", "finditer", "fullmatch",
  "casefold", "isalpha", "isascii", "maketrans", "maxsplit", "IGNORECASE", "MULTILINE", "DOTALL",
  "JSONDecodeError", "DictReader", "mkdir", "cwd", "delenv", "localtime", "sqrt", "readonly",
  "stdin", "stdout", "stderr", "hostname", "filename", "timeout", "prog", "uid_siguiente",
  "pyproject", "toolkits", "completions", "dataset", "metadata", "util", "utils", "urllib", "csv",
  "base64", "b64", "_b64", "_b64url", "ast", "eval", "frozenset", "RuntimeError", "OSError",
  "SMTP_SSL", "Iterable", "dataclasses", "asdict", "dataclass", "pytest", "json", "JSON", "CLI",
  "cli", "llm", "tokens", "ident", "config", "params", "centinela", "sys", "environ", "pathlib", "args", "__init__", "Composio", "smtp",
  "IMAP", "openrouter", "spaphish", "_env", "via_json", "max_spaphish", "_INSTR", "_BIDI", "_LEET",
  "dest", "ca", "cb", "kv", "gc", "fp", "fn", "f1", "cv", "min_df", "_json", "pct", "uid_siguiente",
]

