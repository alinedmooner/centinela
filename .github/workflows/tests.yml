name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # `pruebas` is the check that branch protection requires today. It stays, identical to
  # `tests`, until the required check is switched to `tests`; then it is removed.
  pruebas:
    name: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"

      - name: Install the project
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Run the tests
        run: uv run pytest

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"

      - name: Install the project
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Run the tests
        run: uv run pytest
