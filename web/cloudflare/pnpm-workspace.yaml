# The same rules as the rest of the project: only versions published at least 7 days ago.
minimumReleaseAge: 10080

# Reviewed packages that may run install scripts. The rest are blocked.
allowBuilds:
  # Cloudflare's official runtime and the bundler that Wrangler uses: their scripts only
  # check the platform's binary.
  workerd: true
  esbuild: true
